<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="grad_primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad_lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Outer circle (webcam body) -->
  <circle cx="12" cy="10" r="8" stroke="url(#grad_primary)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner lens circle -->
  <circle cx="12" cy="10" r="3.5" fill="url(#grad_lens)" opacity="0.9"/>
  <!-- Lens highlight -->
  <circle cx="10.8" cy="8.8" r="0.8" fill="white" opacity="0.6"/>
  <!-- Stand/mount -->
  <path d="M7 22h10" stroke="url(#grad_primary)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12 22v-4" stroke="url(#grad_primary)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base indicator dots -->
  <circle cx="12" cy="3" r="0.6" fill="url(#grad_primary)"/>
</svg>
